<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Central de Atendimento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d0f0e;
    --surface: #161918;
    --surface2: #1e2220;
    --border: #2a2f2c;
    --green: #25d366;
    --green-glow: rgba(37,211,102,0.12);
    --red: #e05555;
    --text: #e8ede9;
    --text-dim: #7a8a7d;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px;
    color: var(--green); margin-bottom: 32px; letter-spacing: 0.05em;
  }

  .logo-icon {
    width: 32px; height: 32px; background: var(--green);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 18px;
  }

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }

  .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }

  label {
    display: block; font-size: 11px; font-family: var(--mono);
    color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 6px;
  }

  input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--sans);
    font-size: 14px; padding: 11px 14px; outline: none;
    margin-bottom: 16px; transition: border-color 0.15s;
  }

  input:focus { border-color: var(--green); }

  .btn-login {
    width: 100%; padding: 12px; background: var(--green); color: #000;
    border: none; border-radius: 8px; font-family: var(--mono);
    font-size: 13px; font-weight: 500; cursor: pointer;
    margin-top: 4px; transition: background 0.15s;
  }

  .btn-login:hover { background: #1eb859; }

  .erro {
    background: rgba(224,85,85,0.1); border: 1px solid var(--red);
    color: var(--red); border-radius: 8px; padding: 10px 14px;
    font-size: 13px; margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">💬</div>
    CENTRAL DE ATENDIMENTO
  </div>
  <h1>Entrar</h1>
  <p class="sub">Acesso restrito a atendentes autorizados.</p>
  <div id="erroBox" class="erro" style="display:none">⚠ Usuário ou senha incorretos.</div>
  <form method="POST" action="/login">
    <label>Usuário</label>
    <input type="text" name="usuario" autocomplete="username" autofocus required>
    <label>Senha</label>
    <input type="password" name="senha" autocomplete="current-password" required>
    <button type="submit" class="btn-login">Entrar →</button>
  </form>
</div>
<script>
  // Mostra erro se ?erro=1 na URL
  if (new URLSearchParams(location.search).get('erro')) {
    document.getElementById('erroBox').style.display = 'block';
  }
</script>
</body>
</html>
